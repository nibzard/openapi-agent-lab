apiVersion: agentlab.dev/v1
kind: Pack

metadata:
  id: webclip
  name: webclip
  # 0.2.0 ships the corrected site-errand rubric: two verified clip
  # chains, distinct identifiers, header-based representation checks,
  # full report cross-checks, and a non-scoring comprehension probe.
  # Evidence and scores recorded under 0.1.0 stay under 0.1.0; any
  # regrading of them is labeled derived.
  version: 0.2.0
  description: >-
    A greenfield pack that demonstrates the friction-measurement loop
    on a new API.

requires:
  agentlab: ">=0.1.0 <0.2.0"
  backend_api: 1
  rubric_api: 1

contract:
  entrypoint: contract/openapi.json
  # Authored after the webclip-before batch (2026-08-30): the stateless
  # mock answered every create with the same generated markdown clip and
  # the list never showed the second clip, so two of three participants
  # re-created the image clip and failed the exactly-two-clips check.
  # These fixtures make the served answers consistent with the errand.
  # Static bodies still cannot echo the request; that repair needs the
  # behavior backend. The content endpoint keeps no fixture: a fixture
  # overrides Accept negotiation in the gateway, so wiring image/svg+xml
  # would serve the picture to a text/markdown request.
  response_fixtures:
    - id: clip-created
      operation: "path:POST /v1/clips"
      status: 201
      media_type: application/json
      headers: {}
      default: true
      body:
        kind: json_file
        source: fixtures/clip-created.json
    - id: clips-page
      operation: "path:GET /v1/clips"
      status: 200
      media_type: application/json
      headers: {}
      default: true
      body:
        kind: json_file
        source: fixtures/clips-page.json
    - id: clip-read
      operation: "path:GET /v1/clips/{clipId}"
      status: 200
      media_type: application/json
      headers: {}
      default: true
      body:
        kind: json_file
        source: fixtures/clip-read.json
    - id: render-result
      operation: "path:POST /v1/clips/{clipId}/render"
      status: 200
      media_type: application/json
      headers: {}
      default: true
      body:
        kind: json_file
        source: fixtures/render-result.json
    - id: extract-result
      operation: "path:POST /v1/clips/{clipId}/extract"
      status: 200
      media_type: application/json
      headers: {}
      default: true
      body:
        kind: json_file
        source: fixtures/extract-result.json
    - id: account-read
      operation: "path:GET /v1/account"
      status: 200
      media_type: application/json
      headers: {}
      default: true
      body:
        kind: json_file
        source: fixtures/account.json

server:
  host: 127.0.0.1
  port: 0
  request_body_limit_bytes: 5242880
  request_timeout_ms: 30000
  response_validation: error
  request_validation: error
  concurrency: serial

behavior:
  mode: contract
  completeness: exact
  fallback: none

# The request pipeline verifies a declared security alternative on
# every request (SPEC section 31, step 6), so the pack admits the
# synthetic bearer the runner mints for the http bearer scheme. The
# probe sends it as the Authorization header.
security:
  enforce: false
  credentials: []
  base_url_environment: OAL_BASE_URL

redaction:
  header_names:
    - authorization
  key_patterns:
    - "(?i)api.?key"
    - "(?i)token"
    - "(?i)secret"
  capture_binary_blobs: false
  max_text_capture_bytes: 65536

participant:
  environment:
    inherit: none
    allow:
      - PATH
      - HOME
      - TMPDIR
      - OAL_BASE_URL
      - OAL_AUTH_BEARER

prompt_sets:
  - id: naturalistic
    purpose_disclosure: naturalistic
    instructions:
      source: prompts/naturalistic/instructions.md
      engine: mustache-strict
      delivery: file
      target: AGENTS.md
    launch:
      source: prompts/naturalistic/launch.txt
      engine: literal

evals:
  - id: site-errand
    prompt_set: naturalistic
    task:
      source: tasks/site-errand/task.md
      engine: literal
      target: TASK.md
    # The probe schema must ride along as a participant file: the pack
    # loader resolves rubric schema references only through declared
    # manifest fields, and participant_files is the one for schemas.
    # The participant can read it; the probe is a floor, not a judge.
    participant_files:
      - source: schemas/site-errand-result.schema.json
        target: result.schema.json
      - source: schemas/comprehension-probe.schema.json
        target: comprehension-probe.schema.json
    operation_scope:
      mode: all
    result:
      source: adapter_final
      schema: schemas/site-errand-result.schema.json
      required: true
    rubric: evals/site-errand/rubric.yaml
    scenario: baseline

scenarios:
  - id: baseline

extensions: {}
