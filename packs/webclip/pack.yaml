apiVersion: agentlab.dev/v1
kind: Pack

metadata:
  id: webclip
  name: webclip
  # 0.3.0 flips the pack to scenario behavior: the module under
  # behavior/ owns the clip lifecycle, so two creates return two
  # distinct clips, a deletion answers 404 on every later read, and
  # extraction waits for a render. The 0.2.0 stateless fixtures are
  # gone; the gateway never consults them in scenario mode.
  #
  # 0.2.0 shipped the corrected site-errand rubric: two verified clip
  # chains, distinct identifiers, header-based representation checks,
  # full report cross-checks, and a non-scoring comprehension probe.
  # Evidence and scores recorded under 0.1.0 stay under 0.1.0; any
  # regrading of them is labeled derived.
  version: 0.3.0
  description: >-
    A greenfield pack that demonstrates the friction-measurement loop
    on a new API.

requires:
  agentlab: ">=0.1.0 <0.2.0"
  backend_api: 1
  rubric_api: 1

contract:
  entrypoint: contract/openapi.json
  # The 2026-08-30 webclip-before batch showed the stateless limit: a
  # static body cannot echo the request, so every create served one
  # fixed clip and the list never showed the second one. Scenario mode
  # answers every operation from behavior state instead, so the pack
  # declares no response fixture (SPEC 15.5, 16.1).

server:
  host: 127.0.0.1
  port: 0
  request_body_limit_bytes: 5242880
  request_timeout_ms: 30000
  response_validation: error
  request_validation: error
  concurrency: serial

behavior:
  # Scenario execution (SPEC 16): the module owns the clip lifecycle in
  # JSON state behind the frozen contract. The runner spawns it in a
  # child process, verifies exact operation coverage, and commits every
  # served exchange through the sealed state store transactionally.
  mode: scenario
  completeness: exact
  fallback: none
  backend:
    kind: module
    entrypoint: behavior/index.ts
    export: backend
  state_schema: schemas/scenario-state.schema.json
  state_schema_version: 1
  # The virtual clock keeps a run deterministic: every timestamp a
  # response serves comes from this epoch plus one tick per committed
  # exchange, so identical seeds replay identical bodies.
  clock:
    kind: virtual
    initial: "2000-01-01T00:00:00.000Z"
    tick_ms: 1

# The request pipeline verifies a declared security alternative on
# every request (SPEC section 31, step 6), so the pack admits the
# synthetic bearer the runner mints for the http bearer scheme. The
# probe sends it as the Authorization header.
security:
  enforce: false
  credentials: []
  base_url_environment: OAL_BASE_URL

redaction:
  header_names:
    - authorization
  key_patterns:
    - "(?i)api.?key"
    - "(?i)token"
    - "(?i)secret"
  capture_binary_blobs: false
  max_text_capture_bytes: 65536

participant:
  environment:
    inherit: none
    allow:
      - PATH
      - HOME
      - TMPDIR
      - OAL_BASE_URL
      - OAL_AUTH_BEARER

prompt_sets:
  - id: naturalistic
    purpose_disclosure: naturalistic
    instructions:
      source: prompts/naturalistic/instructions.md
      engine: mustache-strict
      delivery: file
      target: AGENTS.md
    launch:
      source: prompts/naturalistic/launch.txt
      engine: literal

evals:
  - id: site-errand
    prompt_set: naturalistic
    task:
      source: tasks/site-errand/task.md
      engine: literal
      target: TASK.md
    # The probe schema must ride along as a participant file: the pack
    # loader resolves rubric schema references only through declared
    # manifest fields, and participant_files is the one for schemas.
    # The participant can read it; the probe is a floor, not a judge.
    participant_files:
      - source: schemas/site-errand-result.schema.json
        target: result.schema.json
      - source: schemas/comprehension-probe.schema.json
        target: comprehension-probe.schema.json
    operation_scope:
      mode: all
    result:
      source: adapter_final
      schema: schemas/site-errand-result.schema.json
      required: true
    rubric: evals/site-errand/rubric.yaml
    scenario: baseline

scenarios:
  - id: baseline

extensions: {}
