# Site-errand rubric for the webclip pack.
#
# The task names seven ordered steps over two clips. Every step maps
# to a required check: one lifecycle chain per clip (the two chains
# may interleave freely), two distinct clip identifiers, both content
# reads verified through the requested Accept header and the served
# Content-Type header, extraction and deletion scoped to the markdown
# clip, and the quota read after the deletion. Within one chain the
# steps follow the numbered order of the task; between the chains no
# order is imposed beyond the create order the task numbers state.
# Header checks read the normalized header view by name, never a
# header array position.
#
# The report is cross-checked, not just schema-checked: each of the
# nine claim fields must agree with the evidence the chains found.
# The comprehension probe and the extra-create count are recorded
# observations with weight zero; neither can fail the run.
rubric_version: 1
id: webclip-site-errand
description: >-
  Create two clips, render both, fetch both representations, extract
  the markdown text, delete the markdown clip, read the quota.
scoring:
  method: weighted_binary
  pass_threshold: 0.9
checks:
  - id: markdown_clip_chain
    kind: sequence
    match: any
    max_candidates: 10000
    weight: 1
    required: true
    evidence_class: participant_observable
    description: >-
      The essay clip is created as markdown from its URL, rendered,
      fetched as markdown through the Accept header, extracted, and
      deleted. The quota read follows the deletion.
    steps:
      - id: create_markdown_clip
        where: >-
          event.operation.operation_id == "create_clip" &&
          event.response.status >= 200 &&
          event.response.status < 300 &&
          event.request.body.kind == "json" &&
          event.request.body.value.url == "https://example.com/essay" &&
          event.request.body.value.format == "markdown"
        capture:
          markdown_clip_id: event.response.body.value.id
      - id: render_markdown_clip
        where: >-
          event.operation.operation_id == "render_clip" &&
          event.request.path_parameters.clipId == vars.markdown_clip_id &&
          event.response.status >= 200 &&
          event.response.status < 300
      - id: fetch_markdown_content
        where: >-
          event.operation.operation_id == "get_clip_content" &&
          event.request.path_parameters.clipId == vars.markdown_clip_id &&
          event.response.status >= 200 &&
          event.response.status < 300 &&
          event.request.header_values.accept != null &&
          "text/markdown" in event.request.header_values.accept &&
          event.response.header_values["content-type"] != null &&
          "text/markdown" in event.response.header_values["content-type"]
      - id: extract_markdown_text
        where: >-
          event.operation.operation_id == "extract_text" &&
          event.request.path_parameters.clipId == vars.markdown_clip_id &&
          event.response.status >= 200 &&
          event.response.status < 300
      - id: delete_markdown_clip
        where: >-
          event.operation.operation_id == "delete_clip" &&
          event.request.path_parameters.clipId == vars.markdown_clip_id &&
          event.response.status >= 200 &&
          event.response.status < 300
      - id: read_quota
        where: >-
          event.operation.operation_id == "get_account" &&
          event.response.status >= 200 &&
          event.response.status < 300
    postconditions:
      - id: report_agrees_clips_created
        expression: report.clips_created == true
      - id: report_agrees_markdown_clipped
        expression: report.markdown_clipped == true
      - id: report_agrees_markdown_content_fetched
        expression: report.markdown_content_fetched == true
      - id: report_agrees_text_extracted
        expression: report.text_extracted == true
      - id: report_agrees_clip_deleted
        expression: report.clip_deleted == true
      - id: report_agrees_quota_checked
        expression: report.quota_checked == true
  - id: image_clip_chain
    kind: sequence
    match: any
    max_candidates: 10000
    weight: 1
    required: true
    evidence_class: participant_observable
    description: >-
      The dashboard clip is created as an image from its URL,
      rendered, and fetched as an SVG picture through the Accept
      header.
    steps:
      - id: create_image_clip
        where: >-
          event.operation.operation_id == "create_clip" &&
          event.response.status >= 200 &&
          event.response.status < 300 &&
          event.request.body.kind == "json" &&
          event.request.body.value.url == "https://example.com/dashboard" &&
          event.request.body.value.format == "image"
        capture:
          image_clip_id: event.response.body.value.id
      - id: render_image_clip
        where: >-
          event.operation.operation_id == "render_clip" &&
          event.request.path_parameters.clipId == vars.image_clip_id &&
          event.response.status >= 200 &&
          event.response.status < 300
      - id: fetch_image_content
        where: >-
          event.operation.operation_id == "get_clip_content" &&
          event.request.path_parameters.clipId == vars.image_clip_id &&
          event.response.status >= 200 &&
          event.response.status < 300 &&
          event.request.header_values.accept != null &&
          "image/svg+xml" in event.request.header_values.accept &&
          event.response.header_values["content-type"] != null &&
          "image/svg+xml" in event.response.header_values["content-type"]
    postconditions:
      - id: report_agrees_image_clipped
        expression: report.image_clipped == true
      - id: report_agrees_both_rendered
        expression: report.both_rendered == true
      - id: report_agrees_image_content_fetched
        expression: report.image_content_fetched == true
  - id: clip_ids_distinct
    kind: sequence
    match: any
    max_candidates: 10000
    weight: 1
    required: true
    evidence_class: participant_observable
    description: >-
      The two create responses name two different clips. The steps
      follow the create order the task numbers state: the essay clip
      first, the dashboard clip second.
    steps:
      - id: first_create_markdown
        where: >-
          event.operation.operation_id == "create_clip" &&
          event.response.status >= 200 &&
          event.response.status < 300 &&
          event.request.body.kind == "json" &&
          event.request.body.value.url == "https://example.com/essay" &&
          event.request.body.value.format == "markdown"
        capture:
          markdown_clip_id: event.response.body.value.id
      - id: second_create_image
        where: >-
          event.operation.operation_id == "create_clip" &&
          event.response.status >= 200 &&
          event.response.status < 300 &&
          event.request.body.kind == "json" &&
          event.request.body.value.url == "https://example.com/dashboard" &&
          event.request.body.value.format == "image"
        capture:
          image_clip_id: event.response.body.value.id
    postconditions:
      - id: identifiers_differ
        expression: vars.markdown_clip_id != vars.image_clip_id
  - id: two_clips_created
    kind: event
    match: counted
    where: >-
      event.operation.operation_id == "create_clip" &&
      event.response.status >= 200 &&
      event.response.status < 300
    min_count: 2
    weight: 1
    required: true
    evidence_class: participant_observable
    description: >-
      At least two create calls succeed. The request count is evidence
      about calls; the distinct-identifier postcondition turns the two
      requests into two resources.
  - id: single_clip_deletion
    kind: event
    match: counted
    where: >-
      event.operation.operation_id == "delete_clip" &&
      event.response.status >= 200 &&
      event.response.status < 300
    max_count: 1
    weight: 1
    required: true
    evidence_class: participant_observable
    description: >-
      At most one clip deletion succeeds. The markdown chain ties that
      deletion to the markdown clip, so the image clip stays in place.
  - id: result_report
    kind: json_schema
    value: report
    schema: schemas/site-errand-result.schema.json
    weight: 1
    required: true
    evidence_class: participant_observable
    description: The final report matches the pack result schema.
  - id: no_unmatched_delete
    kind: event
    match: counted
    where: >-
      event.request.method == "DELETE" &&
      event.operation.matched == false
    max_count: 0
    weight: 1
    required: true
    evidence_class: participant_observable
    description: >-
      Deletes stay on the declared clip route; blind DELETE requests
      that hit no declared path stay untouched.
  - id: comprehension_probe
    kind: json_schema
    value: report
    schema: schemas/comprehension-probe.schema.json
    weight: 0
    required: false
    evidence_class: participant_observable
    description: >-
      Recorded observation: whether the api_model answer names the
      clip resource. A vocabulary match does not establish
      understanding, so it carries no weight and cannot fail the run.
  - id: extra_create_calls
    kind: event
    match: counted
    where: >-
      event.operation.operation_id == "create_clip" &&
      event.response.status >= 200 &&
      event.response.status < 300
    max_count: 2
    weight: 0
    required: false
    evidence_class: participant_observable
    description: >-
      Diagnostic: more than two successful create calls. The task
      states no exactly-two-creates constraint, so extra calls are
      recorded here instead of failing the run.
signals:
  - id: first_call_is_create
    kind: predicate
    expression: events[0].operation.operation_id == "create_clip"
    description: The participant opened with clip creation.
  - id: first_call_matched
    kind: predicate
    expression: events[0].operation.matched == true
    description: The first request hit a declared route.
