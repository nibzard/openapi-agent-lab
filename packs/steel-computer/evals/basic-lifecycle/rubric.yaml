# Basic-lifecycle rubric for the Steel Computer pack.
#
# The naturalistic prompt set gives no API hints, so this rubric scores
# only what a participant can observe: one session created, confirmed
# live, released, then confirmed released. Steel v1 has no pause or
# resume operations, so the SPEC 39 pause/resume beat is replaced by the
# live/released pair. See MIGRATION-NOTES.md, drift item 2.
rubric_version: 1
id: steel-basic-lifecycle
description: >-
  Start one session, observe it live, release it, and observe it
  released.
scoring:
  method: weighted_binary
  pass_threshold: 0.9
checks:
  - id: lifecycle_flow
    kind: sequence
    match: any
    max_candidates: 10000
    weight: 6
    required: true
    evidence_class: participant_observable
    description: One ordered create, live read, release, released read flow.
    steps:
      - id: create_session
        where: >-
          event.operation.operation_id == "create_session" &&
          event.response.status >= 200 &&
          event.response.status < 300
        capture:
          session_id: event.response.body.value.id
      - id: live_status
        where: >-
          event.operation.operation_id == "get_session" &&
          event.request.path_parameters.id == vars.session_id &&
          event.response.status == 200 &&
          event.response.body.value.status == "live"
      - id: release_session
        where: >-
          event.operation.operation_id == "release_session" &&
          event.request.path_parameters.id == vars.session_id &&
          event.response.status == 200
      - id: released_status
        where: >-
          event.operation.operation_id == "get_session" &&
          event.request.path_parameters.id == vars.session_id &&
          event.response.status == 200 &&
          event.response.body.value.status == "released"
    postconditions:
      - id: report_agrees_released
        expression: report.session_released == true
  - id: result_report
    kind: json_schema
    value: report
    schema: schemas/basic-lifecycle-result.schema.json
    weight: 1
    required: true
    evidence_class: participant_observable
    description: The final report matches the pack result schema.
  - id: single_create
    kind: event
    match: counted
    where: >-
      event.operation.operation_id == "create_session" &&
      event.response.status >= 200 &&
      event.response.status < 300
    min_count: 1
    max_count: 1
    weight: 1
    required: true
    evidence_class: participant_observable
    description: Exactly one session is created.
  - id: no_release_all
    kind: event
    match: counted
    where: event.operation.operation_id == "release_all_sessions"
    max_count: 0
    weight: 1
    required: true
    evidence_class: participant_observable
    description: >-
      The scoped release route is used; the destroy-everything route
      stays untouched.
signals:
  - id: first_call_is_create
    kind: predicate
    expression: >-
      events[0].operation.operation_id == "create_session"
    description: The participant opened with session creation.
  - id: first_call_matched
    kind: predicate
    expression: events[0].operation.matched == true
    description: The first request hit a declared route.
