# Site-errand rubric for the Steel Computer pack.
#
# The naturalistic prompt set gives no API hints, so this rubric scores
# what a participant can observe: one session, one page action on that
# session, one capture, one release. The page action and the capture
# may arrive through any declared operation, because the task names the
# goal, not the routes. Contract mode keeps no page state, so no check
# inspects what the page returned, only that the calls succeeded.
rubric_version: 1
id: steel-site-errand
description: >-
  Start one session, act on one page, capture what it showed, release
  the session.
scoring:
  method: weighted_binary
  pass_threshold: 0.9
checks:
  - id: errand_flow
    kind: sequence
    match: any
    max_candidates: 10000
    weight: 6
    required: true
    evidence_class: participant_observable
    description: One ordered create, page action, capture, release flow.
    steps:
      - id: create_session
        where: >-
          event.operation.operation_id == "create_session" &&
          event.response.status >= 200 &&
          event.response.status < 300
        capture:
          session_id: event.response.body.value.id
      - id: page_action
        where: >-
          event.operation.operation_id == "execute_computer_action" &&
          event.request.path_parameters.sessionId == vars.session_id &&
          event.response.status >= 200 &&
          event.response.status < 300
      - id: capture_evidence
        where: >-
          (event.operation.operation_id == "screenshot" ||
          event.operation.operation_id == "scrape" ||
          (event.operation.operation_id == "execute_computer_action" &&
          event.response.body.value.base64_image != null)) &&
          event.response.status >= 200 &&
          event.response.status < 300
      - id: release_session
        where: >-
          event.operation.operation_id == "release_session" &&
          event.request.path_parameters.id == vars.session_id &&
          event.response.status == 200
    postconditions:
      - id: report_agrees_released
        expression: report.session_released == true
      - id: report_names_capture
        expression: >-
          report.evidence_captured == true &&
          (report.evidence_kind == "screenshot" ||
          report.evidence_kind == "scrape")
  - id: result_report
    kind: json_schema
    value: report
    schema: schemas/site-errand-result.schema.json
    weight: 1
    required: true
    evidence_class: participant_observable
    description: The final report matches the pack result schema.
  - id: single_create
    kind: event
    match: counted
    where: >-
      event.operation.operation_id == "create_session" &&
      event.response.status >= 200 &&
      event.response.status < 300
    min_count: 1
    max_count: 1
    weight: 1
    required: true
    evidence_class: participant_observable
    description: Exactly one session is created.
  - id: no_release_all
    kind: event
    match: counted
    where: event.operation.operation_id == "release_all_sessions"
    max_count: 0
    weight: 1
    required: true
    evidence_class: participant_observable
    description: >-
      The scoped release route is used; the destroy-everything route
      stays untouched.
signals:
  - id: first_call_is_create
    kind: predicate
    expression: >-
      events[0].operation.operation_id == "create_session"
    description: The participant opened with session creation.
  - id: first_call_matched
    kind: predicate
    expression: events[0].operation.matched == true
    description: The first request hit a declared route.
