name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enable corepack before setup-node: the `cache: pnpm` input needs
      # the pnpm binary on PATH when setup-node runs.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Repository secret scan
        run: node scripts/secret-scan.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  # Report only. `pnpm audit` needs registry access, which the runner may
  # not have. The job never blocks a pull request; a release owner reads
  # the log and files findings. See docs/ci-gates.md, section 36.1 gate 14.
  dependency-audit-report:
    name: Dependency audit (report only, never blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enable corepack before setup-node: the `cache: pnpm` input needs
      # the pnpm binary on PATH when setup-node runs.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit --prod --audit-level=high
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  # Node 24 is the only supported major (package.json engines). The
  # clean-install gate runs on Linux and macOS (AC-089).
  tests:
    name: Full test suite (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Enable corepack before setup-node: the `cache: pnpm` input needs
      # the pnpm binary on PATH when setup-node runs.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
