apiVersion: agentlab.dev/v1
kind: Pack

metadata:
  id: external-demo
  name: external-demo
  # The external authoring template (plan SE-P6-02): one state
  # transition, semantic events, a corpus with a reset, an eval with
  # a rubric, and a fidelity declaration. Everything an author needs
  # to copy for a stateful pack lives here once.
  version: 0.1.0
  description: >-
    External authoring template: one counter transition with events,
    corpus, reset, fork, rubric, and fidelity declaration.

requires:
  agentlab: ">=0.1.0 <0.2.0"
  backend_api: 1
  rubric_api: 1

contract:
  entrypoint: contract/openapi.json
  response_fixtures: []

server:
  host: 127.0.0.1
  port: 0
  request_body_limit_bytes: 1048576
  request_timeout_ms: 30000
  response_validation: error
  request_validation: error
  concurrency: serial

behavior:
  mode: scenario
  completeness: exact
  fallback: none
  backend:
    kind: module
    entrypoint: behavior/index.ts
    export: backend
  state_schema: schemas/scenario-state.schema.json
  state_schema_version: 1
  clock:
    kind: virtual
    initial: "2000-01-01T00:00:00.000Z"
    tick_ms: 1

security:
  enforce: false
  credentials: []
  base_url_environment: OAL_BASE_URL

redaction:
  header_names:
    - authorization
  key_patterns:
    - "(?i)api.?key"
    - "(?i)token"
    - "(?i)secret"
  capture_binary_blobs: false
  max_text_capture_bytes: 65536

participant:
  environment:
    inherit: none
    allow:
      - PATH
      - HOME
      - TMPDIR
      - OAL_BASE_URL
      - OAL_AUTH_BEARER

fidelity:
  source: fidelity/claims.json

prompt_sets:
  - id: smoke
    purpose_disclosure: diagnostic
    instructions:
      source: prompts/smoke/instructions.md
      engine: literal
      delivery: file
      target: AGENTS.md
    launch:
      source: prompts/smoke/launch.txt
      engine: literal

evals:
  - id: smoke
    prompt_set: smoke
    task:
      source: tasks/smoke/task.md
      engine: literal
      target: TASK.md
    participant_files:
      - source: schemas/result.schema.json
        target: result.schema.json
    operation_scope:
      mode: all
    result:
      source: adapter_final
      schema: schemas/result.schema.json
      required: true
    rubric: evals/smoke/rubric.yaml
    scenario: baseline

scenarios:
  - id: baseline

corpora:
  - id: demo-core
    source: corpora/core.yaml

extensions: {}
